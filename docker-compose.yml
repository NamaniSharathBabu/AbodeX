services:
  postgres:
    image: postgres:16-alpine
    container_name: abodex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: abodex_db
    ports:
      - "5432:5432"
    volumes:
      - abodex_pgdata:/var/lib/postgresql/data

volumes:
  abodex_pgdata:
